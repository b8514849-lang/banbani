<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR 코드 | hosp_coaching</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #2b6e6e 0%, #3a8f8f 60%, #5bb3b3 100%);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 32px 28px;
      text-align: center;
      box-shadow: 0 16px 60px rgba(0,0,0,.25);
      max-width: 320px;
      width: 90%;
    }
    .label {
      font-size: 13px;
      font-weight: 600;
      color: #3a8f8f;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #2c2c2c;
      margin: 0 0 4px;
    }
    .sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }
    #qr-canvas {
      display: block;
      margin: 0 auto;
    }
    .url {
      margin-top: 20px;
      font-size: 13px;
      color: #555;
      word-break: break-all;
      background: #f5f5f5;
      padding: 10px 14px;
      border-radius: 10px;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
<div class="card">
  <p class="label">hosp_coaching</p>
  <h1>반바니 병원코칭</h1>
  <p class="sub">핸드폰 카메라로 스캔하세요</p>
  <canvas id="qr-canvas"></canvas>
  <div class="url">b8514849-lang.github.io/banbani/hosp-coaching/</div>
  <p class="hint">인터넷 어디서든 접속 가능</p>
</div>

<script>
/* tiny QR encoder — no external deps */
(function(){
  const url = "https://b8514849-lang.github.io/banbani/hosp-coaching/";
  const size = 220;
  const canvas = document.getElementById('qr-canvas');
  canvas.width = size;
  canvas.height = size;

  // Use Google Chart API as an <img> fallback rendered on canvas
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = "https://chart.googleapis.com/chart?chs=220x220&cht=qr&chl=" + encodeURIComponent(url) + "&choe=UTF-8";
  img.onload = () => {
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
  };
  img.onerror = () => {
    // fallback: just show text
    canvas.style.display = 'none';
  };
})();
</script>
</body>
</html>
